data:
  source: "yfinance"          # Yahoo Finance — bebas geo-block, gaya paper akademik
  tickers:                    # Registry 22 koin terverifikasi punya data 15m di Yahoo
    - BTC-USD                 # Bitcoin
    - ETH-USD                 # Ethereum
    - BNB-USD                 # BNB
    - SOL-USD                 # Solana
    - XRP-USD                 # XRP
    - ADA-USD                 # Cardano
    - DOGE-USD                # Dogecoin
    - TRX-USD                 # TRON
    - AVAX-USD                # Avalanche
    - LINK-USD                # Chainlink
    - DOT-USD                 # Polkadot
    - LTC-USD                 # Litecoin
    - BCH-USD                 # Bitcoin Cash
    - NEAR-USD                # NEAR Protocol
    - ATOM-USD                # Cosmos
    - ETC-USD                 # Ethereum Classic
    - SHIB-USD                # Shiba Inu
    - HBAR-USD                # Hedera
    - XLM-USD                 # Stellar
    - FIL-USD                 # Filecoin
    - ALGO-USD                # Algorand
    - VET-USD                 # VeChain
  primary_tf: "15m"           # Yahoo membatasi riwayat 15m ke 60 hari terakhir
  secondary_tf: "1h"          # konfirmasi trend; Yahoo menyediakan 730 hari utk 1h
  candle_limit: 5000          # 15m x 5000 = ~52 hari (di bawah batas 60 hari Yahoo)
  cache_ttl_minutes: 15
  cache_dir: "data/cache"
  fetch_delay_seconds: 3.0    # jeda antar fetch Yahoo Finance (rate-limit protection)
  fetch_batch_size: 10        # setelah N ticker, jeda fetch_batch_pause (train_all.py)
  fetch_batch_pause: 12.0     # detik jeda antar batch

features:
  sequence_length: 60
  lookahead_n: 4
  move_threshold: 0.003

model:
  lstm_units: [128, 64]
  dense_units: 32
  dropout_rate: 0.2
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  patience_early_stop: 10
  n_splits_cv: 5
  # Artefak per ticker disimpan otomatis di model/saved/{TICKER}/
  # (model.keras + scaler.pkl + fgi_encoder.pkl)

signals:
  long_threshold: 0.62
  short_threshold: 0.38
  min_confirmations: 2
  atr_tp1_multiplier: 1.5
  atr_tp2_multiplier: 2.5
  atr_sl_multiplier: 1.0

logging:
  predictions_csv: "logs/predictions.csv"
  validation_csv: "logs/validation_report.csv"
  log_level: "INFO"

# ---------------------------------------------------------------------------
# Optimasi hyperparameter (skripsi: GA vs Grid Search vs baseline manual)
# Default konservatif untuk CPU/pilot. Untuk Colab GPU boleh dinaikkan ke:
#   population_size: 16, generations: 10, grid.budget: 160,
#   search_epochs: 30, final_splits: 5
# CATATAN: lookahead_n & move_threshold adalah pendefinisi tugas — BUKAN
# hyperparameter, tidak boleh masuk ruang pencarian.
# ---------------------------------------------------------------------------
optimization:
  seed: 42
  search_epochs: 20          # epoch tereduksi saat pencarian (GA & Grid) + early stopping
  final_splits: 3            # jumlah fold walk-forward untuk evaluasi akhir (hemat waktu)
  final_epochs: null         # null = pakai model.epochs penuh; isi angka utk hemat waktu
  output_root: null          # null = repo; isi path (mis. Google Drive) agar hasil persisten
  tickers: [BTC-USD, ETH-USD, SOL-USD, LINK-USD, SHIB-USD]
  search_space:
    sequence_length: [30, 45, 60, 90, 120]
    lstm_units_1: [32, 64, 96, 128]
    lstm_units_2: [16, 32, 48, 64]
    dropout_rate: [0.1, 0.2, 0.3, 0.4]
    learning_rate: [0.01, 0.005, 0.001, 0.0005, 0.0001]
    batch_size: [16, 32, 64]
  ga:
    population_size: 10
    generations: 6
    tournament_size: 3
    crossover_rate: 0.8
    mutation_rate: 0.15
    elitism: 2               # ≈ 40–50 evaluasi/koin dengan caching fitness
  grid:
    budget: 50               # budget-matched dengan GA (grid penuh 4.800 tak realistis)
